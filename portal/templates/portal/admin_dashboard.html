{% extends 'portal/base_portal.html' %}
{% block title %}Panel general | Portal Atención Psi{% endblock %}
{% block content %}
<div class="portal-hub">
    <h1 class="portal-hub-saludo">Hola Leandro y Barbi</h1>
    <p class="portal-hub-pregunta">¿Qué querés hacer hoy?</p>

    <div class="portal-hub-botones">
        <a href="{% url 'portal_admin_agenda' %}" class="portal-hub-boton portal-hub-boton-agenda">
            <span class="portal-hub-boton-icono">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
            </span>
            <span class="portal-hub-boton-titulo">Agenda</span>
            <span class="portal-hub-boton-sub">Dar de alta o baja, destacar profesionales</span>
        </a>

        <a href="{% url 'portal_admin_finanzas' %}" class="portal-hub-boton portal-hub-boton-finanzas">
            <span class="portal-hub-boton-icono">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 15.2c.3.9 1.3 1.6 2.7 1.6 1.7 0 2.8-.8 2.8-2s-1.1-1.8-2.8-1.8-2.8-.6-2.8-1.8 1.1-2 2.8-2c1.4 0 2.4.7 2.7 1.6M12 6.5v1.4M12 16.1v1.4"/></svg>
            </span>
            <span class="portal-hub-boton-titulo">Manejar finanzas</span>
            <span class="portal-hub-boton-sub">Ingresos, egresos y ganancia neta</span>
        </a>
    </div>
</div>
{% endblock %}
